name: Build & Deploy

# Redeploy on every push to main: build the image in the cloud, push to GHCR, then the
# self-hosted runner on `orb` pulls it and restarts the stack.
on:
  push:
    branches: [main]
  workflow_dispatch: {}            # allow manual runs from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: true         # a newer push supersedes an in-flight deploy

env:
  # Lowercase and hardcoded — GHCR rejects the uppercase in the repo owner name.
  IMAGE: ghcr.io/loufasupreme/project-red-rover

jobs:
  # ── Cheap gate before anything is built or deployed ────────────────────────
  # There is no test suite, so this is a syntax gate: it catches a typo that would
  # otherwise build cleanly and then crash-loop on orb. Worth the 20 seconds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check src/server/index.js
          node --check src/public/client.js

  # ── Build in the cloud, push to GHCR ───────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # minted per run, expires with it

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .                       # repo root — the Dockerfile's COPYs assume this
          file: deployment/Dockerfile
          push: true
          # Two tags per build: :latest for the next deploy, :<sha> as an immutable
          # rollback target. No trailing comments inside the block below — YAML
          # takes every line of a `|` scalar literally, so a `#` becomes part of the tag.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Stamps the commit into the image, so on orb you can always answer
          # "which build is actually running?":
          #   docker inspect project-red-rover \
          #     --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max            # cache every layer, not just the last

  # ── Deploy on orb ──────────────────────────────────────────────────────────
  deploy:
    needs: build
    # All three labels must match the runner registered on orb
    # (config.sh --labels orb,project-red-rover).
    runs-on: [self-hosted, orb, project-red-rover]
    permissions:
      packages: read               # pull from GHCR
    steps:
      - name: Log in to GHCR (so docker can pull the private image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull & restart
        working-directory: /home/alchemist/docker/davis-innovations/project-red-rover
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f      # drop the superseded image; tagged :sha builds are kept

      - name: Wait for health
        # A deploy that leaves the container unhealthy should fail loudly here rather
        # than being discovered by a visitor. The app binds immediately and /api/status
        # makes no upstream calls, so this normally passes on the first or second try;
        # the generous ceiling only covers a slow image start.
        working-directory: /home/alchemist/docker/davis-innovations/project-red-rover
        run: |
          for i in $(seq 1 12); do
            state=$(docker inspect --format '{{.State.Health.Status}}' project-red-rover 2>/dev/null || echo unknown)
            echo "attempt $i: $state"
            if [ "$state" = "healthy" ]; then exit 0; fi
            if [ "$state" = "unhealthy" ]; then
              docker compose logs --tail 60 app
              echo "Container reported unhealthy."
              exit 1
            fi
            sleep 10
          done
          docker compose logs --tail 60 app
          echo "Timed out waiting for the container to report healthy."
          exit 1
